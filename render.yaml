# Blueprint de Render: "New > Blueprint" y elige este repositorio.
services:
  - type: web
    name: eros-wear
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: WHATSAPP_NUMBER
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: eros_wear
